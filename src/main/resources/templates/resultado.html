<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultado</title>
    <meta http-equiv="refresh" content="2;url=/" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
<div class="card shadow-sm text-center p-4" style="max-width: 400px;">
    <h4 class="mb-3 text-primary" th:text="${mensaje}">Mensaje aquí</h4>
    <p class="mb-2 text-dark fw-semibold" th:text="${ipInfo}">Balanza IP: ...</p>

    <!-- Spinner centrado -->
    <div class="d-flex justify-content-center mb-3">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>

    <p class="text-muted mb-0">Serás redirigido al inicio en unos segundos...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
