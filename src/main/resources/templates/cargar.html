<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cargar Excel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">
    <h2 class="mb-4 text-center">Subir archivo Excel</h2>

    <form method="post" enctype="multipart/form-data" action="/cargar" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label for="archivo" class="form-label">Seleccionar archivo Excel</label>
            <input type="file" class="form-control" name="archivo" id="archivo" accept=".xls,.xlsx" required />
        </div>
        <button type="submit" class="btn btn-primary">Subir</button>
    </form>

    <!-- Mensaje -->
    <div class="mt-4" th:if="${mensaje}">
        <div class="alert alert-info" th:text="${mensaje}"></div>
    </div>

    <!-- Tabla con datos -->
    <div class="table-responsive mt-4" th:if="${datosExcel}">
        <table class="table table-bordered table-hover table-sm align-middle">
            <tbody>
            <tr th:each="fila : ${datosExcel}">
                <td th:each="celda : ${fila}" th:text="${celda}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
